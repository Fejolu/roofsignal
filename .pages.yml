- name: articles
  label: Nieuwe kennisartikelen
  type: collection
  path: content/articles
  format: json
  filename:
    template: '{fields.slug}.json'
    field: create
  view:
    fields:
    - title
    - published
    - date
    primary: title
    sort:
    - date
    - title
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Titel
    type: string
    required: true
  - name: slug
    label: Webadres
    type: string
    required: true
    description: Alleen kleine letters, cijfers en streepjes. Het artikel verschijnt op /kennisbank/webadres/. Kies
      dit bij het aanmaken; wijzig het later niet.
  - name: published
    label: Publiceren
    type: boolean
    default: false
    description: Uit = concept. Aan = na opslaan op de website en in de kennisbank.
  - name: date
    label: Publicatiedatum
    type: date
    required: true
    options:
      format: yyyy-MM-dd
      time: false
  - name: category
    label: Onderwerp
    type: string
    default: Dak & gevel
    required: true
  - name: description
    label: Korte omschrijving
    type: text
    required: true
    description: Voor het overzicht en zoekresultaten.
  - name: image
    label: Hoofdfoto
    type: image
  - name: image_alt
    label: Beschrijving van de foto
    type: string
  - name: body
    label: Artikel
    type: rich-text
    required: true
    options:
      format: html
      switcher: false
settings:
  hide: true
  content:
    merge: true

<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Offerte bekijken en akkoord geven | RoofSignal</title>
  <link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css?v=20260811&brand=4">
<script src="assets/analytics-config.js"></script>
  <script src="assets/analytics.js"></script>
</head>
<body class="quote-acceptance-page">
  <main class="quote-acceptance-shell">
    <a class="logo" href="/" aria-label="RoofSignal Property Intelligence"><span class="mark" aria-hidden="true"><img src="/assets/roofsignal-bimi.svg" alt=""></span><span class="logo-lockup"><span class="logo-wordmark"><span class="logo-roof">ROOF</span><span class="logo-signal">SIGNAL</span></span><span class="logo-tagline" aria-hidden="true"><span>P</span><span>R</span><span>O</span><span>P</span><span>E</span><span>R</span><span>T</span><span>Y</span><span class="logo-tagline-space"></span><span>I</span><span>N</span><span>T</span><span>E</span><span>L</span><span>L</span><span>I</span><span>G</span><span>E</span><span>N</span><span>C</span><span>E</span></span></span></a>
    <section class="quote-acceptance-card" data-quote-acceptance>
      <p class="eyebrow orange">Digitale offerte</p>
      <h1>Offerte bekijken.</h1>
      <p data-quote-status>De offertegegevens worden opgehaald…</p>
      <div data-quote-summary hidden></div>
      <form data-quote-accept-form hidden>
        <label>Uw naam<input name="actor_name" autocomplete="name" required></label>
        <label>Uw e-mailadres<input name="actor_email" type="email" autocomplete="email" required></label>
        <label class="quote-confirm-check">
          <input name="confirmed" type="checkbox" required>
          <span>Ik heb deze offerte en de bijbehorende voorwaarden gelezen en ga hiermee akkoord.</span>
        </label>
        <button class="btn" type="submit">Akkoord bevestigen</button>
        <p class="form-note" data-accept-status></p>
      </form>
    </section>
    <p class="quote-acceptance-help">Vragen? Mail <a href="mailto:info@roofsignal.nl">info@roofsignal.nl</a> of bel 085 21 28 019.</p>
  </main>
  <script src="assets/supabase-config.js"></script>
  <script src="assets/quote-acceptance.js?v=3" defer></script>
</body>
</html>

name: KVK-verbruikswaarschuwingen
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roofsignal-kvk-budget-warnings
  cancel-in-progress: false
jobs:
  warnings:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verstuur openstaande KVK-verbruikswaarschuwing
        env:
          CONSUMER_AUTOMATION_SECRET: ${{ secrets.CONSUMER_AUTOMATION_SECRET }}
        run: python tools/process_kvk_budget_alerts.py

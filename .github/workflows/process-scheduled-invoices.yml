name: Geplande facturen verwerken

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Alleen controleren; niets versturen
        required: true
        default: true
        type: boolean
      test_only:
        description: Verwerk uitsluitend expliciete interne testfacturen
        required: true
        default: false
        type: boolean
      prepare_internal_test:
        description: Maak eerst een interne testfactuur aan
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: process-scheduled-invoices
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verwerk facturen waarvan de verzendtijd is bereikt
        env:
          AUTOMATION_SECRET: ${{ secrets.INVOICE_AUTOMATION_SECRET }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          TEST_ONLY: ${{ github.event_name == 'schedule' && 'false' || inputs.test_only }}
          PREPARE_INTERNAL_TEST: ${{ github.event_name == 'schedule' && 'false' || inputs.prepare_internal_test }}
        run: |
          if [ -z "$AUTOMATION_SECRET" ]; then
            echo "::error title=Factuurautomatisering niet geconfigureerd::GitHub secret INVOICE_AUTOMATION_SECRET ontbreekt."
            exit 1
          fi
          if [ "${PREPARE_INTERNAL_TEST:-false}" = "true" ]; then
            curl --fail-with-body --silent --show-error \
              -X POST "https://kakpticlxlaxtebhsuoh.supabase.co/functions/v1/process-scheduled-invoices" \
              -H "x-automation-secret: $AUTOMATION_SECRET" \
              -H "Content-Type: application/json" \
              -d '{"prepareInternalTest":true,"recipient":"ferry@roofsignal.nl"}'
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "https://kakpticlxlaxtebhsuoh.supabase.co/functions/v1/process-scheduled-invoices" \
            -H "x-automation-secret: $AUTOMATION_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"dryRun\":${DRY_RUN:-true},\"testOnly\":${TEST_ONLY:-false}}"

name: Supabase productie-release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/supabase-production.yml"
      - "supabase/**"
      - "tools/supabase_release.py"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: roofsignal-supabase-production
  cancel-in-progress: false

jobs:
  release:
    name: Gecontroleerde productie-release
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Installeer testomgeving
        run: python -m pip install pytest
      - name: Controleer en publiceer database en functies
        run: python tools/supabase_release.py --deploy
